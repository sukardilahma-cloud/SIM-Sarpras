<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Top Isometric Box -->
    <path d="M 0 -130 L 120 -60 L 0 10 L -120 -60 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 0 10 L 120 -60 L 120 70 L 0 140 Z" fill="#93c5fd"/>
    <path d="M 0 10 L -120 -60 L -120 70 L 0 140 Z" fill="#60a5fa"/>
    <!-- Box Inner Detail Lines -->
    <path d="M 0 10 L 0 140" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M -60 -25 L 60 -25" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/>
    <!-- School Landmark Symbol badge in center -->
    <circle cx="0" cy="-60" r="32" fill="#2563eb"/>
    <path d="M -16 -54 L 0 -70 L 16 -54 L 16 -48 L -16 -48 Z" fill="#ffffff"/>
    <rect x="-12" y="-48" width="24" height="12" fill="#ffffff"/>
    <rect x="-4" y="-42" width="8" height="6" fill="#2563eb"/>
  </g>
</svg>
